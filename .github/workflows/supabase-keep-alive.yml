name: Supabase Keep Alive

on:
  schedule:
    # Tự động chạy vào lúc 0:00 (UTC) mỗi 3 ngày
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Cho phép chạy thủ công bất cứ lúc nào qua GitHub UI

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\n" -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/experiments?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
