  <script>
    /* [TOUCH ASSET FIX] Force full-size Pixi assets on touch devices. The chemical engine sets
       PIXI.settings.IMAGE_SCALE="@0.5x" on touch (nobook_chemical.min.js: `_.touchDevice() ? ... "@0.5x"`),
       but this build ships only full-size PNGs, so @0.5x asset paths 404 and dropped equipment
       silently fails to render. Intercept the setter -> null so the engine loads full-size assets. */
    (function () {
      function patchPixiImageScale(pixi) {
        if (!pixi || !pixi.settings || pixi.settings.__nbUseFullSizeAssets) return;
        try {
          var imageScale = pixi.settings.IMAGE_SCALE || null;
          Object.defineProperty(pixi.settings, 'IMAGE_SCALE', {
            configurable: true,
            get: function () { return imageScale; },
            set: function (value) { imageScale = value === '@0.5x' ? null : value; },
          });
          pixi.settings.IMAGE_SCALE = null;
          pixi.settings.__nbUseFullSizeAssets = true;
        } catch (error) {
          try { pixi.settings.IMAGE_SCALE = null; pixi.settings.__nbUseFullSizeAssets = true; } catch (e) {}
        }
      }
      patchPixiImageScale(window.PIXI);
      var pixiValue = window.PIXI;
      try {
        Object.defineProperty(window, 'PIXI', {
          configurable: true,
          get: function () { return pixiValue; },
          set: function (value) { pixiValue = value; patchPixiImageScale(value); },
        });
      } catch (error) {}
      var attempts = 0;
      var timer = setInterval(function () {
        attempts += 1;
        patchPixiImageScale(window.PIXI);
        if ((window.PIXI && window.PIXI.settings && window.PIXI.settings.__nbUseFullSizeAssets) || attempts > 1000) clearInterval(timer);
      }, 10);
    })();
  </script>

  <script>
    /* [SAFARI IFRAME FIX] Recover from webpack ChunkLoadError. Safari aborts async chunks in a
       cross-origin iframe (ITP / cache partitioning) -> ChunkLoadError. Reload once per session;
       auto-reset the guard after a clean load so a later navigation can still recover. */
    (function () {
      function isChunkErr(m) {
        return /ChunkLoadError|Loading chunk\s|Importing a module script failed|error loading dynamically imported module/i.test(m || "");
      }
      function recover(m) {
        if (!isChunkErr(m)) return;
        try { if (sessionStorage.getItem("__nbChunkReloaded")) return; sessionStorage.setItem("__nbChunkReloaded", "1"); } catch (e) {}
        try { if (window.caches && caches.keys) caches.keys().then(function (ks) { ks.forEach(function (n) { caches.delete(n); }); }); } catch (e) {}
        location.reload();
      }
      window.addEventListener("error", function (e) { recover(e && e.message); });
      window.addEventListener("unhandledrejection", function (e) { var r = e && e.reason; recover(r && (r.message || String(r))); });
      window.addEventListener("load", function () { setTimeout(function () { try { sessionStorage.removeItem("__nbChunkReloaded"); } catch (e) {} }, 5000); });
    })();
  </script>

  <script>
    window.global = window.global || window;
    window.__appStartTime = new Date().getTime();

    // === Suppress noisy console output from bundled JS ===
    console.log = function () { };
    console.info = function () { };
    console.debug = function () { };
    console.warn = function () { };

    // === LOCAL FIX: Auto-add required URL params if missing ===
    (function () {
      var params = new URLSearchParams(window.location.search);
      var changed = false;
      if (!params.has('moduleId')) { params.set('moduleId', '9'); changed = true; }
      if (!params.has('ignoreBlock')) { params.set('ignoreBlock', 'true'); changed = true; }
      if (changed) {
        window.location.replace(window.location.pathname + '?' + params.toString());
      }
    })();

    window.__nbExperimentState = {
      selected: null,
      restoreApplied: false,
      restoreError: null,
      restorePollingStarted: false,
      saveInFlight: false,
    };

    function showNbPopup(options) {
      try {
        var title = (options && options.title) || 'Thông báo';
        var message = (options && options.message) || '';
        var tone = (options && options.tone) || 'info';
        var okText = (options && options.okText) || 'OK';
        var cancelText = options && options.cancelText;

        var existing = document.getElementById('nb-save-popup');
        if (existing) {
          existing.parentNode.removeChild(existing);
        }

        var backdrop = document.createElement('div');
        backdrop.id = 'nb-save-popup';
        backdrop.setAttribute('role', 'presentation');
        backdrop.tabIndex = -1;
        backdrop.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);';

        var dialog = document.createElement('div');
        dialog.setAttribute('role', 'dialog');
        dialog.setAttribute('aria-modal', 'true');
        dialog.setAttribute('aria-label', title);
        dialog.tabIndex = -1;
        dialog.style.cssText = 'position:relative;z-index:2147483647;width:min(420px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.22);padding:20px 18px;';
        dialog.addEventListener('click', function (e) { e.stopPropagation(); });

        var header = document.createElement('div');
        header.style.cssText = 'font-size:16px;font-weight:700;letter-spacing:-.01em;color:#0f172a;margin:0 0 8px;';
        header.textContent = title;

        var body = document.createElement('div');
        body.style.cssText = 'font-size:14px;line-height:1.6;color:#475569;margin:0 0 16px;';
        body.textContent = message;

        var actions = document.createElement('div');
        actions.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;';

        var ok = document.createElement('button');
        ok.type = 'button';
        ok.textContent = okText;
        ok.style.cssText = 'min-height:44px;border-radius:12px;padding:0 16px;border:1px solid transparent;font-weight:700;cursor:pointer;color:#fff;background:' + (tone === 'danger' ? '#dc2626' : '#3555d3') + ';';

        var cancel = null;
        if (cancelText) {
          cancel = document.createElement('button');
          cancel.type = 'button';
          cancel.textContent = cancelText;
          cancel.style.cssText = 'min-height:44px;border-radius:12px;padding:0 16px;border:1px solid rgba(15,23,42,.14);font-weight:700;cursor:pointer;color:#0f172a;background:#fff;';
        }

        function close(result) {
          if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
          if (typeof options.onClose === 'function') {
            options.onClose(result);
          }
        }

        ok.addEventListener('click', function () { close(true); });
        if (cancel) {
          cancel.addEventListener('click', function () { close(false); });
          actions.appendChild(cancel);
        }
        backdrop.addEventListener('click', function (e) { if (e.target === backdrop) close(false); });
        backdrop.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') close(false);
        });

        actions.appendChild(ok);
        dialog.appendChild(header);
        dialog.appendChild(body);
        dialog.appendChild(actions);
        backdrop.appendChild(dialog);
        document.body.appendChild(backdrop);

        window.setTimeout(function () {
          try {
            backdrop.focus();
            (cancel || ok).focus();
          } catch (e) { }
        }, 0);
      } catch (e) {
        window.alert((options && options.message) || '');
      }
    }

    function getLabMain() {
      return window.__main || window.chemicalMain || null;
    }

    function getLabCanvas() {
      var main = getLabMain();
      if (main && main.canvas && main.canvas.width > 0 && main.canvas.height > 0) {
        return main.canvas;
      }

      var viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
      var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
      var candidates = Array.prototype.slice.call(document.querySelectorAll('canvas'));
      var source = candidates
        .map(function (item) {
          if (!item || item.width <= 0 || item.height <= 0) {
            return null;
          }

          var style = window.getComputedStyle(item);
          if (!style || style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity) === 0) {
            return null;
          }

          var rect = item.getBoundingClientRect();
          var visibleWidth = Math.max(0, Math.min(rect.right, viewportWidth) - Math.max(rect.left, 0));
          var visibleHeight = Math.max(0, Math.min(rect.bottom, viewportHeight) - Math.max(rect.top, 0));
          var visibleArea = visibleWidth * visibleHeight;
          if (visibleArea <= 0) {
            return null;
          }

          return { item: item, visibleArea: visibleArea, pixelArea: item.width * item.height };
        })
        .filter(function (entry) { return !!entry; })
        .sort(function (a, b) {
          return b.visibleArea - a.visibleArea || b.pixelArea - a.pixelArea;
        })[0];

      return source ? source.item : null;
    }

    function renderThumbnailWithBackground(source, width, height) {
      try {
        var thumbnailCanvas = document.createElement('canvas');
        thumbnailCanvas.width = width;
        thumbnailCanvas.height = height;
        var context = thumbnailCanvas.getContext('2d');
        if (!context) {
          return '';
        }

        context.fillStyle = '#000000';
        context.fillRect(0, 0, width, height);
        context.drawImage(source, 0, 0, width, height);
        return thumbnailCanvas.toDataURL('image/jpeg', 0.92);
      } catch (error) {
        return '';
      }
    }

    function captureCanvasThumbnailFallback() {
      var canvas = getLabCanvas();
      if (!canvas || typeof canvas.toDataURL !== 'function') {
        return '';
      }

      try {
        var maxWidth = 320;
        var ratio = canvas.height / canvas.width;
        var targetWidth = Math.min(maxWidth, canvas.width);
        var targetHeight = Math.max(1, Math.round(targetWidth * ratio));
        var rendered = renderThumbnailWithBackground(canvas, targetWidth, targetHeight);
        if (rendered) {
          return rendered;
        }

        return canvas.toDataURL('image/jpeg', 0.92);
      } catch (error) {
        return '';
      }
    }

    async function normalizeThumbnailBackground(dataUrl) {
      if (typeof dataUrl !== 'string' || dataUrl.indexOf('data:image/') !== 0) {
        return '';
      }

      return await new Promise(function (resolve) {
        var image = new Image();
        image.onload = function () {
          resolve(renderThumbnailWithBackground(image, image.naturalWidth || image.width, image.naturalHeight || image.height) || dataUrl);
        };
        image.onerror = function () {
          resolve(dataUrl);
        };
        image.src = dataUrl;
      });
    }

    function getRuntimeScreenshotApi() {
      var candidates = [
        window.chemicalMain,
        window.__main,
        window.chemical,
        window.chemicalLab,
        window.lab,
        window.nbLab,
        window.NBLab,
        window.__nbLab,
        window.__sdk,
        window.sdk,
        window.__appSdk,
      ];

      for (var i = 0; i < candidates.length; i += 1) {
        var candidate = candidates[i];
        if (candidate && typeof candidate.takeScreenShot === 'function') {
          return candidate;
        }
      }

      return null;
    }

    async function captureExperimentThumbnail() {
      var main = getLabMain();
      if (main && typeof main.freshRender === 'function') {
        try {
          main.freshRender();
        } catch (error) { }
      }

      var screenshotApi = getRuntimeScreenshotApi();
      if (screenshotApi && typeof screenshotApi.takeScreenShot === 'function') {
        try {
          var screenshot = await screenshotApi.takeScreenShot({ type: 'jpeg', quality: 0.92, transparent: false });
          if (typeof screenshot === 'string' && screenshot.indexOf('data:image/') === 0) {
            var normalized = await normalizeThumbnailBackground(screenshot);
            return normalized || screenshot;
          }
        } catch (error) { }
      }

      return captureCanvasThumbnailFallback();
    }

    async function getExperimentThumbnail() {
      return await captureExperimentThumbnail();
    }

    window.__nbSaveExperiment = async function () {
      var state = window.__nbExperimentState || {};
      if (state.saveInFlight) {
        return;
      }

      state.saveInFlight = true;

      if (!window.chemicalMain || typeof window.chemicalMain.execute !== 'function' || !window.NBCommand || !window.NBCommand.GET_DATA) {
        state.saveInFlight = false;
        showNbPopup({ title: 'Không thể lưu', message: 'Lab chưa sẵn sàng để lưu.', tone: 'danger' });
        return;
      }

      // Save modal
      var defaultName = state.selected && state.selected.name ? state.selected.name : 'Untitled Experiment';
      var defaultDesc = state.selected && state.selected.description ? state.selected.description : '';

      var saveModalBackdrop = document.createElement('div');
      saveModalBackdrop.id = 'nb-save-modal';
      saveModalBackdrop.setAttribute('role', 'presentation');
      saveModalBackdrop.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(15,23,42,.55);backdrop-filter:blur(2px);';

      var saveModal = document.createElement('div');
      saveModal.setAttribute('role', 'dialog');
      saveModal.setAttribute('aria-modal', 'true');
      saveModal.setAttribute('aria-label', 'Lưu thí nghiệm');
      saveModal.style.cssText = 'width:min(520px,100%);background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.22);padding:18px 18px 14px;';

      var saveTitle = document.createElement('div');
      saveTitle.style.cssText = 'font-size:16px;font-weight:800;letter-spacing:-.01em;color:#0f172a;margin:0 0 12px;';
      saveTitle.textContent = 'Lưu thí nghiệm';

      var form = document.createElement('div');
      form.style.cssText = 'display:flex;flex-direction:column;gap:10px;';

      var nameLabel = document.createElement('label');
      nameLabel.textContent = 'Tên thí nghiệm';
      nameLabel.style.cssText = 'font-size:13px;font-weight:700;color:#0f172a;margin:0;';

      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = defaultName;
      nameInput.autocomplete = 'off';
      nameInput.style.cssText = 'height:44px;border-radius:12px;border:1px solid rgba(15,23,42,.14);padding:0 12px;font-size:14px;outline:none;';

      var descLabel = document.createElement('label');
      descLabel.textContent = 'Mô tả (tuỳ chọn)';
      descLabel.style.cssText = 'font-size:13px;font-weight:700;color:#0f172a;margin:2px 0 0;';

      var descInput = document.createElement('textarea');
      descInput.value = defaultDesc;
      descInput.rows = 3;
      descInput.style.cssText = 'border-radius:12px;border:1px solid rgba(15,23,42,.14);padding:10px 12px;font-size:14px;outline:none;resize:vertical;min-height:88px;max-height:220px;';

      var actions2 = document.createElement('div');
      actions2.style.cssText = 'display:flex;justify-content:flex-end;gap:10px;margin-top:12px;';

      var cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Hủy';
      cancelBtn.style.cssText = 'min-height:44px;border-radius:12px;padding:0 16px;border:1px solid rgba(15,23,42,.14);font-weight:800;cursor:pointer;background:#fff;color:#0f172a;';

      var confirmBtn = document.createElement('button');
      confirmBtn.type = 'button';
      confirmBtn.textContent = 'Lưu';
      confirmBtn.style.cssText = 'min-height:44px;border-radius:12px;padding:0 16px;border:1px solid transparent;font-weight:800;cursor:pointer;color:#fff;background:#3555d3;';

      function closeModal() {
        if (saveModalBackdrop && saveModalBackdrop.parentNode) saveModalBackdrop.parentNode.removeChild(saveModalBackdrop);
      }

      var modalPromise = new Promise(function (resolve) {
        var settled = false;

        function cleanup() {
          document.removeEventListener('keydown', onKeyDown);
        }

        function finish(result) {
          if (settled) return;
          settled = true;
          cleanup();
          closeModal();
          resolve(result);
        }

        function onKeyDown(e) {
          if (e && e.key === 'Escape') {
            finish(null);
          }
        }

        cancelBtn.addEventListener('click', function () {
          finish(null);
        });

        confirmBtn.addEventListener('click', function () {
          var n = (nameInput.value || '').trim();
          if (!n) return;
          var d = (descInput.value || '').trim();
          finish({ name: n, description: d });
        });

        // Click outside dialog
        saveModalBackdrop.addEventListener('click', function (e) {
          if (e.target === saveModalBackdrop) {
            finish(null);
          }
        });

        // Don't close when clicking inside dialog
        saveModal.addEventListener('click', function (e) { e.stopPropagation(); });

        // Escape closes modal
        document.addEventListener('keydown', onKeyDown);
      });

      form.appendChild(nameLabel);
      form.appendChild(nameInput);
      form.appendChild(descLabel);
      form.appendChild(descInput);
      actions2.appendChild(cancelBtn);
      actions2.appendChild(confirmBtn);
      form.appendChild(actions2);

      saveModal.appendChild(saveTitle);
      saveModal.appendChild(form);
      saveModalBackdrop.appendChild(saveModal);
      document.body.appendChild(saveModalBackdrop);

      window.setTimeout(function () { try { nameInput.focus(); } catch (e) { } }, 0);

      var modalResult = await modalPromise;
      if (!modalResult) {
        state.saveInFlight = false;
        return;
      }
      var name = modalResult.name;
      var description = modalResult.description;
      var content = '';

      try {
        content = window.chemicalMain.execute(window.NBCommand.GET_DATA);
      } catch (error) {
        state.saveInFlight = false;
        showNbPopup({ title: 'Không thể lưu', message: 'Không lấy được dữ liệu thí nghiệm để lưu.', tone: 'danger' });
        return;
      }

      if (!content) {
        state.saveInFlight = false;
        showNbPopup({ title: 'Không thể lưu', message: 'Dữ liệu thí nghiệm đang rỗng.', tone: 'danger' });
        return;
      }

      try {
        var thumbnailUrl = await getExperimentThumbnail();
        var payload = {
          name: name,
          description: description,
          moduleId: Number(new URLSearchParams(window.location.search).get('moduleId')) || 9,
          content: content,
          thumbnailUrl: thumbnailUrl,
        };

        var endpoint = '/experiment/create';
        if (state.selected && state.selected.id) {
          endpoint = '/experiment/update';
          payload.id = state.selected.id;
        }

        var response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        var json = await response.json();
        if (!response.ok || json.code !== 200) {
          throw new Error(json.msg || 'Save failed');
        }

        state.selected = json.data;
        window.__nb_selected_experiment = json.data;
        showNbPopup({ title: 'Lưu thành công', message: name ? ('“' + name + '”') : 'Thí nghiệm đã được lưu.', tone: 'success' });
      } catch (error) {
        showNbPopup({ title: 'Lưu thất bại', message: error && error.message ? error.message : 'Lưu thí nghiệm thất bại.', tone: 'danger' });
      } finally {
        state.saveInFlight = false;
      }
    };

    (function () {
      var experimentId = new URLSearchParams(window.location.search).get('experimentId');
      if (!experimentId) {
        return;
      }

      fetch('/experiment/detail?id=' + encodeURIComponent(experimentId))
        .then(function (response) { return response.json(); })
        .then(function (json) {
          if (!json || json.code !== 200 || !json.data) {
            throw new Error(json && json.msg ? json.msg : 'Load experiment failed');
          }
          window.__nbExperimentState.selected = json.data;
          window.__nb_selected_experiment = json.data;
        })
        .catch(function (error) {
          window.__nbExperimentState.restoreError = error && error.message ? error.message : 'Load experiment failed';
        });
    })();

    window.__nbApplyExperimentRestore = function () {
      var state = window.__nbExperimentState || {};
      var experiment = state.selected;
      if (!experiment || state.restoreApplied || !window.chemicalMain || !window.NBCommand) {
        return false;
      }

      if (!window.chemicalMain.creationComplete || typeof window.chemicalMain.execute !== 'function') {
        return false;
      }

      try {
        if (experiment.content) {
          window.chemicalMain.execute(window.NBCommand.RESTORE_DATA, experiment.content);
        } else if (experiment.id && window.NBCommand.SHOW_EXPERIMENT_BY_ID) {
          window.chemicalMain.execute(window.NBCommand.SHOW_EXPERIMENT_BY_ID, { id: experiment.id });
        }
        state.restoreApplied = true;
        return true;
      } catch (error) {
        state.restoreError = error && error.message ? error.message : 'Restore failed';
        return false;
      }
    };

    window.__nbStartRestorePolling = function () {
      var state = window.__nbExperimentState || {};
      if (state.restorePollingStarted) {
        return;
      }

      state.restorePollingStarted = true;
      var tries = 0;
      var timer = setInterval(function () {
        tries += 1;
        if (window.__nbApplyExperimentRestore()) {
          clearInterval(timer);
          return;
        }
        if (tries > 120) {
          clearInterval(timer);
        }
      }, 1000);
    };

    window.__nbStartRestorePolling();

    // === LOCAL FIX: Unlock all VIP-gated equipment via built-in backdoor ===
    // umi.js internally checks localStorage.getItem("un_lock_vip") to bypass VIP gate
    localStorage.setItem('un_lock_vip', '1');

    // === LOCAL FIX: Suppress PixiJS TypeError for missing texture .image ===
    window.addEventListener('error', function (event) {
      var msg = event.message || '';
      // Suppress the specific TypeError: Cannot read properties of undefined (reading 'image')
      if (msg.indexOf("reading 'image'") !== -1 || msg.indexOf('reading "image"') !== -1) {
        console.warn('[LOCAL PATCH] Suppressed PixiJS texture error:', msg);
        event.preventDefault();
        event.stopPropagation();
        return true;
      }
    }, true);

    // Also patch PIXI loader resources after page loads
    window.addEventListener('load', function () {
      // Patch PIXI if available - make loader.resources a Proxy that returns safe object for undefined keys
      setTimeout(function () {
        try {
          if (window.PIXI && window.PIXI.Loader) {
            var OrigLoader = window.PIXI.Loader;
            var origShared = OrigLoader.shared;
            if (origShared) {
              var origResources = origShared.resources;
              Object.defineProperty(origShared, 'resources', {
                get: function () {
                  return new Proxy(origResources || {}, {
                    get: function (target, key) {
                      var val = target[key];
                      if (val === undefined) {
                        // Return a safe stub with .image property
                        return { image: new Image(), texture: window.PIXI.Texture.EMPTY, data: null };
                      }
                      return val;
                    }
                  });
                },
                configurable: true
              });
            }
          }
        } catch (e) {
          console.warn('[LOCAL PATCH] Could not patch PIXI:', e);
        }
      }, 2000);
    });

    // LOCAL BYPASS: Force dismiss loading spinner after app initializes

        if (this._isIntercepted) {

        // Try to find the Redux store via React DevTools or window
        try {
          // Try finding redux dispatch via React root
          var rootEl = document.getElementById('root');
          if (!rootEl) { setTimeout(tryDismissSpinner, 500); return; }

          // Look for redux store in window

        setTimeout(ensureHeaderDecor, 600);
        setTimeout(ensureHeaderDecor, 2000);
        setTimeout(ensureHeaderDecor, 4000);
        new MutationObserver(function () {
          if (!document.getElementById('ths-logo-inject') || !document.getElementById('nb-experiment-actions')) ensureHeaderDecor();
        }).observe(document.documentElement, { childList: true, subtree: true });
      })();

      // === LOCAL FIX: THS brand in loading screen ===
      (function () {
        var ID = 'ths-load-brand';
        var overlay = null;

        function inject() {
          if (document.getElementById(ID)) return;
          var root = document.getElementById('root');
          if (!root || !root.firstElementChild) return;
          overlay = root.firstElementChild;

          // Move flask up
          if (!overlay._up) {
            overlay._up = true;
            overlay.style.marginTop = '-40px';
          }

          var el = document.createElement('div');
          el.id = ID;
          el.style.cssText = 'position:fixed;top:72%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;text-align:center;z-index:2147483647';
          el.innerHTML =
            '<img src="https://truonghocsoquocgia.vn/assets/logo/Logomark.svg" onerror="this.style.display=\'none\'" alt="THS" style="height:44px;width:auto;" />' +
            '<div style="display:flex;flex-direction:column;align-items:center;gap:2px;">' +
            '<span style="font-size:13px;font-weight:700;color:#fff;letter-spacing:0.4px;font-family:Inter,sans-serif;">TRƯỜNG HỌC SỐ</span>' +
            '<span style="font-size:9.5px;color:rgba(255,255,255,0.5);letter-spacing:1.2px;font-family:Inter,sans-serif;">PHÒNG THÍ NGHIỆM ẢO</span>' +
            '</div>';
          document.body.appendChild(el);
        }

        function remove() {
          var el = document.getElementById(ID);
          if (!el || el._done) return;
          el._done = true;
          el.style.transition = 'opacity 0.4s';
          el.style.opacity = '0';
          setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 450);
        }

        new MutationObserver(function (_, obs) {
          inject();
          // React re-renders overlay with new className when loading finishes
          // OR detect that header is now visible (has height > 0)
          var header = document.querySelector('[class*="header___"]');
          var headerVisible = header && header.offsetHeight > 0;
          var overlayChanged = overlay && overlay._initClass && overlay.className !== overlay._initClass;
          if (overlayChanged || headerVisible) {
            obs.disconnect();
            setTimeout(remove, 4000);
          }
          // Save initial class on first inject
          if (overlay && !overlay._initClass && overlay.className) {
            overlay._initClass = overlay.className;
          }
        }).observe(document.getElementById('root') || document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });

        setTimeout(remove, 4000);
      })();

      // === LOCAL FIX: Lock document.title + favicon to custom brand ===
      (function () {
        var TITLE = 'THS - Phòng Thí Nghiệm Ảo';
        var FAVICON = 'https://truonghocsoquocgia.vn/assets/logo/Logomark.svg';

        // Force favicon via JS (bypasses browser cache on <link rel="icon">)
        function setFavicon() {
          // Remove all existing favicon links
          document.querySelectorAll('link[rel*="icon"]').forEach(function (el) { el.remove(); });
          // Create new one with cache-busting timestamp
          var link = document.createElement('link');
          link.rel = 'icon';
          link.type = 'image/svg+xml';
          link.href = FAVICON + '?v=' + Date.now();
          document.head.appendChild(link);
        }
        setFavicon();

        // Lock title
        document.title = TITLE;
        var titleEl = document.querySelector('title');
        if (titleEl) {
          new MutationObserver(function () {
            if (document.title !== TITLE) document.title = TITLE;
          }).observe(titleEl, { childList: true, characterData: true, subtree: true });
        }
        setInterval(function () {
          if (document.title !== TITLE) document.title = TITLE;
        }, 2000);
      })();

    })();
  </script>
  <!-- NB Sync Bridge -->
  <script src="/js/nb-sync-bridge.js"></script>
